backend:
  name: github
  repo: your-github-username/ringway-air-services # Change to your user/repo
  branch: main
  base_url: https://your-oauth-worker.yourname.workers.dev # Or your OAuth proxy URL

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  # --- 1. CORE OPERATIONAL PILLARS & PAGES (Drag & Drop Builder) ---
  - name: "pages"
    label: "Public Pages & Services"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { label: "Page Title", name: "title", widget: "string" }
      - { label: "Short Subtitle / Hero Tagline", name: "subtitle", widget: "string" }
      - label: "Division / Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Executive Charter", value: "charter" }
          - { label: "Cargo & Humanitarian Relief", value: "humanitarian" }
          - { label: "Aircraft Acquisition & Ferry Delivery", value: "ferry" }
          - { label: "General Hub Page", value: "general" }
      - { label: "Hero Header Image", name: "hero_image", widget: "image", required: false }

      # DRAG-AND-DROP MODULAR SECTIONS
      - label: "Page Sections (Drag to Reorder)"
        name: "sections"
        widget: "list"
        types:
          - label: "Text + Image Split Block"
            name: "split_section"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body Text", name: "body", widget: "markdown" }
              - { label: "Side Image", name: "image", widget: "image" }
              - label: "Image Alignment"
                name: "image_align"
                widget: "select"
                options: ["left", "right"]
                default: "right"

          - label: "Feature Cards Grid (3-Col)"
            name: "feature_grid"
            widget: "object"
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "Card Badge / Tag", name: "badge", widget: "string", hint: "e.g. VIP, AOG, STOL" }
                  - { label: "Card Title", name: "card_title", widget: "string" }
                  - { label: "Description", name: "card_desc", widget: "text" }

          - label: "Call to Action / Dispatch Brief"
            name: "callout"
            widget: "object"
            fields:
              - { label: "Banner Text", name: "text", widget: "string" }
              - { label: "Button Label", name: "btn_label", widget: "string", default: "Access Operations Desk" }
              - { label: "Button URL", name: "btn_url", widget: "string", default: "/#dispatch" }

  # --- 2. AIRCRAFT FLEET (Paint Bay) ---
  - name: "fleet"
    label: "Aircraft Fleet (Paint Bay)"
    folder: "data/fleet"
    create: true
    format: "json"
    fields:
      - { label: "Aircraft Model", name: "model", widget: "string" }
      - { label: "Registration (Tail)", name: "reg", widget: "string" }
      - { label: "ICAO Type Code", name: "type", widget: "string" }
      - label: "Operational Division"
        name: "role"
        widget: "select"
        options: ["Executive Charter", "Cargo / Humanitarian", "Ferry & Delivery", "Multi-Role"]
      - { label: "Livery Preview Image", name: "image", widget: "image" }
      - { label: "Livery ZIP Download URL", name: "download_url", widget: "string", required: false }

  # --- 3. SCENERY & AIRPORT HUBS ---
  - name: "scenery"
    label: "Scenery & Airport Hubs"
    folder: "data/scenery"
    create: true
    format: "json"
    fields:
      - { label: "Airport Name", name: "title", widget: "string" }
      - { label: "ICAO Code", name: "icao", widget: "string" }
      - { label: "Status", name: "status", widget: "select", options: ["In Development", "Operational / Released", "Under Survey"] }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Scenery Package ZIP URL", name: "download_url", widget: "string", required: false }

  # --- 4. SITE SETTINGS & MAINTENANCE TOGGLE ---
  - name: "settings"
    label: "System Settings & Status"
    files:
      - file: "data/status.json"
        label: "Maintenance & System Banner"
        name: "status_config"
        fields:
          - { label: "Maintenance Mode Active", name: "maintenance_active", widget: "boolean", default: false }
          - { label: "Sub-Title", name: "subtitle", widget: "string", default: "Virtual Operations Desk • MSFS 2024" }
          - { label: "Maintenance Headline", name: "headline", widget: "string", default: "Operations Portal Under Maintenance" }
          - { label: "Notice Details", name: "notice", widget: "text", default: "System updates in progress. Returning shortly." }
          - { label: "Return to Service Estimate", name: "rts_estimate", widget: "string", default: "MSFS 2024 Launch" }

      - file: "data/stats.json"
        label: "Flight Hours Counter"
        name: "stats_data"
        fields:
          - { label: "Total Logged Hours", name: "total_hours", widget: "number", default: 3500 }
          - { label: "Jet Transport Hours", name: "jet_hours", widget: "number", default: 1800 }
          - { label: "Turboprop & STOL Hours", name: "turboprop_hours", widget: "number", default: 1200 }