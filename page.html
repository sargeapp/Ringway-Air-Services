<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ringway Air Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <header>
    <div class="container nav-bar">
      <div class="brand">
        <a href="/" style="text-decoration:none; color:inherit;">
          <h1>RINGWAY <span>AIR SERVICES</span></h1>
        </a>
        <p id="nav-brand-callout">Virtual Operations Desk &bull; MSFS 2024</p>
      </div>
      <nav id="dynamic-nav" class="nav-badges"></nav>
    </div>
  </header>

  <main class="container section-block" style="min-height: 60vh;">
    <div class="hero-content" style="margin-bottom: 25px;">
      <h2 id="page-title" style="font-size: 2rem;">Loading...</h2>
      <p id="page-subtitle" style="color: var(--ras-orange); font-weight: bold;"></p>
    </div>
    <div id="page-body" class="card" style="padding: 30px; font-size: 1.05rem; line-height: 1.8;"></div>
  </main>

  <footer>
    <div class="container">
      <p>Ringway Air Services &copy; 2026 &bull; MSFS 2024 Architecture &bull; <a href="/admin/" style="color:#777;">Admin Desk</a></p>
    </div>
  </footer>

  <script>
    async function loadPage() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('p');
      if (!slug) {
        document.getElementById('page-title').innerText = "404 - Page Not Found";
        return;
      }

      try {
        const res = await fetch(`/data/pages/${slug}.json`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        document.title = `${data.title} | Ringway Air Services`;
        document.getElementById('page-title').innerText = data.title;
        document.getElementById('page-subtitle').innerText = data.subtitle || '';
        document.getElementById('page-body').innerHTML = marked.parse(data.body || '');
      } catch {
        document.getElementById('page-title').innerText = "404 - Page Not Found";
        document.getElementById('page-body').innerHTML = "<p>The requested operations page does not exist.</p>";
      }
    }
    document.addEventListener("DOMContentLoaded", loadPage);
  </script>
</body>
</html>
